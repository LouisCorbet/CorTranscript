name: Backend and audio mixing tests
on:
  push:
    branches: [main]
    paths: ['app.py', 'index.html', 'audio-inputs.js', 'requirements.txt', 'tests/**', '.github/workflows/checks.yml']
  pull_request:
    paths: ['app.py', 'index.html', 'audio-inputs.js', 'requirements.txt', 'tests/**', '.github/workflows/checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt httpx playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test backend persistence and browser audio mixing
        run: python -m unittest discover -s tests -v
